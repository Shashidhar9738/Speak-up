# Render service definition for the SpeakUp API.
#
# Only the API runs here. The pages are served from GitHub Pages, which can host
# static files but cannot run Express, so the two live on different origins —
# hence SPEAKUP_CORS_ORIGIN below and the matching HOSTED_API in assets/api.js.
#
# This file documents the service and lets it be recreated from scratch. The
# running service was created through the API and is not managed by a blueprint,
# so changing values here does not change the live service on its own.
services:
  - type: web
    name: speakup-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Without this the server binds 127.0.0.1 and Render's proxy cannot reach
      # it: the deploy succeeds, every request times out.
      - key: SPEAKUP_HOST
        value: 0.0.0.0

      # TLS terminates at Render's proxy, so the app sees plain HTTP and would
      # otherwise warn that submissions cross the network unencrypted.
      - key: SPEAKUP_BEHIND_TLS
        value: true

      # Who may register for the dashboard. The built-in default is comviva.com,
      # which would lock the owner of this deployment out of their own instance.
      - key: SPEAKUP_ADMIN_DOMAINS
        value: gmail.com

      # Both of these exist because the domain above is a public mail provider.
      # SPEAKUP_AUTO_APPROVE defaults to true, which on a public URL would mean
      # any gmail address anywhere could register and read every complaint;
      # false puts registrations in a queue instead. The queue is only useful if
      # somebody can empty it, and bootstrap owners otherwise fall back to the
      # placeholder addresses in config.js, so the owner is named explicitly.
      - key: SPEAKUP_AUTO_APPROVE
        value: false
      - key: SPEAKUP_ADMIN_EMAILS
        value: shashi.shashi727@gmail.com

      # The Pages origin. In production an empty value means same-origin only,
      # which would block every request the dashboard makes from github.io.
      - key: SPEAKUP_CORS_ORIGIN
        value: https://shashidhar9738.github.io

      # Never committed. Production refuses to boot without at least 32
      # characters, because a known secret lets anyone mint an admin token.
      - key: SPEAKUP_ADMIN_SECRET
        sync: false
